<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колекція відеоігор - Лабораторна робота 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 { color: #2c3e50; }
        .instructions {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="instructions">
        <h1>Колекція відеоігор 🎮</h1>
        <p>Відкрийте консоль розробника у браузері (F12 -> Console), щоб переглянути результат виконання завдань, сортування масивів та роботу методів об'єктів.</p>
        <button onclick="addGameToLibrary()">Додати нову гру</button>
    </div>

    <!-- Підключаємо ваш файл зі скриптом -->
    <script src="script.js"></script>
</body>
</html>
