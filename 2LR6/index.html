<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Generator - Варіант 10</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="generator">
    
    <!-- Вкладки  -->
    <div class="tabs" id="tabs">
      <button class="tab active" type="button" data-tab="radius">Border Radius</button>
      <button class="tab" type="button" data-tab="border-color">Border Color</button>
      <button class="tab" type="button" data-tab="border-style">Border Style</button>
    </div>

    <!-- Двоколонкова сітка -->
    <div class="main-grid">
      
      <!-- ліва колонка -->
      <div class="left-panel">
        
        <!-- Вкладка 1 -->
        <div class="tab-content active" data-content="radius">
          <h2>Border Radius</h2>
          <p class="tab-subtitle">Налаштуйте радіуси заокруглення кутів елемента</p>
          
          <div class="control">
            <label for="top-left">Top Left</label>
            <div class="control-row">
              <input id="top-left" type="range" min="0" max="100" value="30">
              <span id="top-left-value" class="value-badge">30 px</span>
            </div>
          </div>

          <div class="control">
            <label for="top-right">Top Right</label>
            <div class="control-row">
              <input id="top-right" type="range" min="0" max="100" value="60">
              <span id="top-right-value" class="value-badge">60 px</span>
            </div>
          </div>

          <div class="control">
            <label for="bottom-right">Bottom Right</label>
            <div class="control-row">
              <input id="bottom-right" type="range" min="0" max="100" value="20">
              <span id="bottom-right-value" class="value-badge">20 px</span>
            </div>
          </div>

          <div class="control">
            <label for="bottom-left">Bottom Left</label>
            <div class="control-row">
              <input id="bottom-left" type="range" min="0" max="100" value="80">
              <span id="bottom-left-value" class="value-badge">80 px</span>
            </div>
          </div>
        </div>

        <!-- Вкладка 2 -->
        <div class="tab-content" data-content="border-color">
          <h2>Border Color</h2>
          <p class="tab-subtitle">Налаштуйте колір рамки елемента</p>
          <div class="control">
            <label for="border-color">Колір рамки</label>
            <div class="control-row">
              <input id="border-color" type="color" value="#818cf8">
            </div>
          </div>
        </div>

        <!-- Вкладка 3 -->
        <div class="tab-content" data-content="border-style">
          <h2>Border Style</h2>
          <p class="tab-subtitle">Налаштуйте тип і стиль рамки елемента</p>
          <div class="control">
            <label for="border-style">Стиль рамки</label>
            <div class="control-row">
              <select id="border-style">
                <option value="none">none</option>
                <option value="solid" selected>solid</option>
                <option value="dashed">dashed</option>
                <option value="dotted">dotted</option>
                <option value="double">double</option>
              </select>
            </div>
          </div>
        </div>

      </div>

      <!-- Права колонка  -->
      <div class="right-panel">
        
        <!-- Секція Preview -->
        <section class="preview-section">
          <h2>Preview</h2>
          <div class="preview-card">
            <div id="preview" class="preview">
              <span>Preview</span>
              <button id="preview-button" type="button">Click</button>
            </div>
          </div>
          <p id="coordinates">X: 0; Y: 0</p>
        </section>

        <!-- Секція CSS Code -->
        <section class="result">
          <h2>CSS Code</h2>
          <div class="code-box">
            <textarea id="css-code" rows="3" readonly></textarea>
            <button id="copy-button" type="button" aria-label="Скопіювати">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <p id="copy-message"></p>
        </section>

      </div>

    </div>

    <!-- Форма пресета  -->
    <form id="preset-form">
      <h2>Збереження пресета</h2>
      <label for="preset-name">Назва пресета</label>
      <input id="preset-name" type="text" placeholder="Введіть назву пресета">
      <span id="preset-error"></span>
      <button type="submit">Зберегти</button>
    </form>

  </main>

  <button id="scroll-top" type="button" aria-label="Повернутися вгору">↑</button>
</body>
</html>
